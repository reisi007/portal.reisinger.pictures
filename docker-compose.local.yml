services:
  search:
    image: getmeili/meilisearch:v1.48.3
    container_name: portal_search_local
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local_meili_secret
    ports: ["7700:7700"]
    volumes: ["search_data_local:/meili_data"]

  mailpit:
    image: axllent/mailpit
    container_name: portal_mailpit_local
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  search_data_local: