name: CI

# Push auf ALLE Branches (inkl. Dependabot-Branches wie
# dependabot/npm_and_yarn/frontend/...): Dependabot-ausgelöste pull_request-Runs
# erhalten KEINE Secrets und nur read-only GITHUB_TOKEN (werden wie Fork-PRs
# behandelt). Da E2E Stripe-Test-Keys braucht, läuft die komplette CI-Logik über
# `push`, damit Secrets verfügbar sind. `pull_request` deckt normale PRs ab.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test_db
          MYSQL_USER: portal_user
          MYSQL_PASSWORD: admin
        # Ports + Credentials matchen backend/phpunit.xml (DB_PORT=3307 ...)
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      meilisearch:
        image: getmeili/meilisearch:v1.48.3
        ports:
          - 7701:7700
        env:
          MEILI_MASTER_KEY: test_meili_secret
          MEILI_ENV: development
      mailpit:
        # phpunit.xml sendet via SMTP auf 127.0.0.1:1026; MailpitAssertions.php
        # liest Mails ueber die HTTP-API auf 127.0.0.1:8026 (hardcodiert).
        image: axllent/mailpit
        ports:
          - 1026:1025
          - 8026:8025
    steps:
      - uses: actions/checkout@v4
      # PHP-Tests laufen im Prod-Image ghcr.io/reisi007/php-base:8.5 (PHP 8.5 +
      # exiftool + alle App-Extensions) - identisch zur Prod-Runtime. Composer
      # kommt wie in Prod ueber das offizielle composer:latest-Image. Die
      # CI-Env (DB/Meili/Mail/JWT/Admin) steht in backend/.env.ci und wird als
      # `.env` eingespielt. `--network host` -> Dienste bleiben unter
      # 127.0.0.1:3307/7701/1026 erreichbar (phpunit.xml + .env unveraendert).
      - name: Start PHP container (prod image)
        run: |
          docker run -d --name php \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            ghcr.io/reisi007/php-base:8.5 \
            sleep infinity
          until docker exec php php -v > /dev/null 2>&1; do sleep 1; done
      - name: Prepare environment
        run: cp .env.ci .env
      - name: Install dependencies
        # Prod-Nutzung: `composer install --ignore-platform-reqs` (composer:latest)
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            composer install --ignore-platform-reqs --no-interaction --optimize-autoloader
      - name: Generate app key
        run: docker exec php php artisan key:generate
      - name: Grant parallel test DB permissions
        # paratest legt pro Worker `portal_test_db_test_<n>` an; der von
        # mariadb:11.4 angelegte portal_user hat nur Rechte auf portal_test_db.
        # Laravel erzeugt Worker-DBs via CREATE DATABASE -> globales CREATE noetig.
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON \`portal\_test\_db\_test\_%\`.* TO 'portal_user'@'%'; GRANT CREATE ON *.* TO 'portal_user'@'%'; FLUSH PRIVILEGES;"
      - name: Run migrations
        run: docker exec php php artisan migrate --force
      - name: Seed database
        # DatabaseSeeder ruft am Ende app:import-locations auf (Geonames-Download).
        run: docker exec php php artisan db:seed --force
      - name: Run PHPUnit
        # Parallele Worker via paratest (php-base:8.5 enthaelt seit dem
        # Rebuild ext-pcntl + posix). pipefail laesst den Step fehlschlagen,
        # wenn Tests rot sind (nicht das tee). Log fuer Summary-Step.
        run: |
          set -o pipefail
          docker exec php php artisan test --no-ansi --parallel 2>&1 | tee /tmp/phpunit.log
      - name: Backend Test-Summary
        if: always()
        run: |
          CLEAN=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/phpunit.log 2>/dev/null || true)
          # Parse results: "Tests: 42, Assertions: 120, Errors: 1, Failures: 2"
          # or "OK (42 tests, 120 assertions)"
          SUMMARY=$(grep -E '^Tests:|OK \(' <<< "$CLEAN" | tail -n 1)
          TESTS=$(echo "$SUMMARY" | sed -n 's/.*Tests: \([0-9]*\).*/\1/p; s/.*OK (\([0-9]*\) tests.*/\1/p')
          ASSERTIONS=$(echo "$SUMMARY" | sed -n 's/.*Assertions: \([0-9]*\).*/\1/p; s/.*OK ([0-9]* tests, \([0-9]*\) assertions.*/\1/p')
          ERRORS=$(echo "$SUMMARY" | sed -n 's/.*Errors: \([0-9]*\).*/\1/p')
          FAILURES=$(echo "$SUMMARY" | sed -n 's/.*Failures: \([0-9]*\).*/\1/p')
          TESTS=${TESTS:-0}
          ASSERTIONS=${ASSERTIONS:-0}
          ERRORS=${ERRORS:-0}
          FAILURES=${FAILURES:-0}
          TOTAL=$((ERRORS + FAILURES))
          if [ "$TOTAL" -eq 0 ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="PASS"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="FAIL"
          fi
          {
            echo "## Backend (PHPUnit)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | $STATUS_ICON $STATUS_TEXT |"
            echo "| Tests | $TESTS total |"
            echo "| Assertions | $ASSERTIONS total |"
            if [ "$ERRORS" -gt 0 ]; then
              echo "| Errors | ❌ $ERRORS |"
            fi
            if [ "$FAILURES" -gt 0 ]; then
              echo "| Failures | ❌ $FAILURES |"
            fi
            FAILED=$(grep -E '^\s*[0-9]+\) ' <<< "$CLEAN" | tail -n 10)
            if [ -n "$FAILED" ]; then
              echo ""
              echo "<details><summary>Failed tests</summary>"
              echo ""
              echo '```text'
              echo "$FAILED"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (Lint, Build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # prebuild (tsc -b + check-i18n) läuft automatisch vor `pnpm build`
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:run

  e2e:
    name: E2E (Playwright)
    # Job-level `if` darf KEINEN secrets-Context lesen (offizielle Context
    # availability: jobs.<job_id>.if -> github, needs, vars, inputs). Secrets
    # existieren nur bei push (inkl. dependabot-Branches) und bei PRs aus dem
    # eigenen Repo (fork == false). Fork-PRs werden übersprungen - dort sind
    # Secrets ohnehin nie verfügbar. Das tatsächliche Fehlen der Secrets wird
    # im ersten Step geprüft (dort ist der secrets-Context erlaubt).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      # Zuordnung spiegelt backend/.env (lokales, funktionierendes E2E-Setup):
      # STRIPE_KEY = pk_test (publishable), STRIPE_SECRET = sk_test (secret key).
      # StripePaymentService nutzt config('services.stripe.secret') als API-Key.
      STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
      STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      JWT_SECRET: 2d093d84542d70f133a1689afb5866bed31edd1b520ce8c02ea9d25559fb0834
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_test_db
          MYSQL_USER: portal_user
          MYSQL_PASSWORD: admin
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      meilisearch:
        image: getmeili/meilisearch:v1.48.3
        ports:
          - 7701:7700
        env:
          MEILI_MASTER_KEY: test_meili_secret
          MEILI_ENV: development
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Stripe test keys are configured
        env:
          STRIPE_SECRET_SET: ${{ secrets.STRIPE_SECRET != '' }}
        run: |
          if [ "$STRIPE_SECRET_SET" != "true" ]; then
            echo "::error::STRIPE_SECRET (sk_test) / STRIPE_KEY (pk_test) / STRIPE_WEBHOOK_SECRET Secrets sind nicht konfiguriert - E2E kann nicht laufen."
            exit 1
          fi
      # Backend laeuft im Prod-Image ghcr.io/reisi007/php-base:8.5 (PHP 8.5 +
      # exiftool) - identisch zur Prod-Runtime. Composer ueber composer:latest.
      # CI-Env steht in backend/.env.ci (-> .env); nur die Stripe-Test-Keys
      # kommen per Container-Env aus den GitHub Secrets. `--network host` ->
      # Frontend (Runner) und Backend teilen 127.0.0.1.
      - name: Start PHP container (prod image)
        run: |
          docker run -d --name php \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            -e STRIPE_KEY="${{ secrets.STRIPE_KEY }}" \
            -e STRIPE_SECRET="${{ secrets.STRIPE_SECRET }}" \
            -e STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            ghcr.io/reisi007/php-base:8.5 \
            sleep infinity
          until docker exec php php -v > /dev/null 2>&1; do sleep 1; done
      - name: Prepare backend environment
        working-directory: backend
        run: cp .env.ci .env
      - name: Install backend dependencies
        working-directory: backend
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app/backend \
            composer install --ignore-platform-reqs --no-interaction --optimize-autoloader
      - name: Generate app key
        working-directory: backend
        run: docker exec php php artisan key:generate
      - name: Run migrations
        working-directory: backend
        run: docker exec php php artisan migrate --force
      - name: Seed database
        working-directory: backend
        # Full Seed: erzeugt den von den E2E-Specs erwarteten
        # admin@example.com mit allen Rollen + Katalog. DatabaseSeeder ruft
        # am Ende app:import-locations auf (Geonames-Download via HTTP).
        run: docker exec php php artisan db:seed --force
      - name: Start backend server
        working-directory: backend
        run: |
          docker exec php php artisan serve --host=127.0.0.1 --port=8000 > /tmp/php-serve.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://127.0.0.1:8000/api/ping > /dev/null; do sleep 1; done'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:4321/ > /dev/null; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8000
          # Publik-Key = VITE_STRIPE_PUBLIC_KEY, sonst Fallback auf STRIPE_KEY
          # (pk_test - Zuordnung entspricht backend/.env, siehe oben)
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY || secrets.STRIPE_KEY }}
      - name: Run E2E tests
        working-directory: frontend
        # `list`-Reporter fuer stdout-Zusammenfassung, `html` bleibt fuer den
        # Artifact-Upload. pipefail -> rote Tests scheitern den Step.
        run: |
          set -o pipefail
          pnpm test:e2e --reporter=list,html 2>&1 | tee /tmp/e2e.log
        env:
          CI: "1"
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin
      - name: E2E Test-Summary
        if: always()
        run: |
          PASSED=$(grep -oP '^\s*\K\d+(?= passed)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          FAILED=$(grep -oP '^\s*\K\d+(?= failed)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          FLAKY=$(grep -oP '^\s*\K\d+(?= flaky)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          SKIPPED=$(grep -oP '^\s*\K\d+(?= did not run)' /tmp/e2e.log 2>/dev/null | tail -n 1)
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          FLAKY=${FLAKY:-0}
          SKIPPED=${SKIPPED:-0}
          TOTAL=$((PASSED + FAILED))
          if [ "$FAILED" -eq 0 ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="PASS"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="FAIL"
          fi
          {
            echo "## E2E (Playwright)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Status | $STATUS_ICON $STATUS_TEXT |"
            echo "| Passed | ✅ $PASSED |"
            if [ "$FAILED" -gt 0 ]; then
              echo "| Failed | ❌ $FAILED |"
            fi
            if [ "$FLAKY" -gt 0 ]; then
              echo "| Flaky | ⚠️ $FLAKY |"
            fi
            if [ "$SKIPPED" -gt 0 ]; then
              echo "| Skipped | ⏭️ $SKIPPED |"
            fi
            echo "| Total | $TOTAL |"
            FAILED_TESTS=$(grep -E '^\s*[0-9]+\) \[' /tmp/e2e.log 2>/dev/null | tail -n 10)
            if [ -n "$FAILED_TESTS" ]; then
              echo ""
              echo "<details><summary>Failed tests</summary>"
              echo ""
              echo '```text'
              echo "$FAILED_TESTS"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
