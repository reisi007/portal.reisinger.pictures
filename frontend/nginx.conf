server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing: Wenn die Datei nicht existiert, leite auf index.html um
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Requests sollen eigentlich nicht hier landen (Reverse Proxy macht das),
    # aber zur Sicherheit blockieren wir sie oder leiten sie ab, falls Nginx falsch konfiguriert ist.
    location /api/ {
        return 404;
    }

    # Browser Caching für statische Assets (CSS/JS/Bilder)
    location ~* \.(?:css|js|jpg|svg|webp|png|ico|woff2?|eot|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
