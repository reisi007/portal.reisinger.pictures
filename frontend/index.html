<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reisinger Foto Portal</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1E5631" />
  <meta name="msapplication-TileColor" content="#1E5631" />
  <meta name="theme-color" content="#1E5631" />

  <script>
    (function() {
      var host = window.location.hostname.toLowerCase();
      if (!(host.endsWith('.localhost') || host === 'localhost')) return;
      var parts = host.split('.');
      var brand = (parts[0] !== 'localhost' && parts[0].length > 0) ? parts[0] : 'rp';
      var files = ['favicon.ico', 'favicon-32x32.png', 'favicon-16x16.png', 'apple-touch-icon.png', 'site.webmanifest', 'safari-pinned-tab.svg'];
      files.forEach(function(f) {
        var el = document.querySelector('link[href="/' + f + '"]');
        if (el) el.href = '/brands/' + brand + '/' + f;
      });
    })();
  </script>


  <script src="https://stats.reisinger.pictures/x7k2p.js" defer></script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
