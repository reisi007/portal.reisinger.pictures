<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reisinger Foto Portal</title>

  <script>
    (function() {
      var host = window.location.hostname.toLowerCase();
      var brand = 'rp';
      // Dev fallback: *.localhost → brand from subdomain
      if ((host.endsWith('.localhost') || host === 'localhost') && !host.startsWith('localhost')) {
        var parts = host.split('.');
        if (parts.length >= 2 && parts[0] !== 'localhost' && parts[0].length > 0) {
          brand = parts[0];
        }
      }
      var themeColor = '#1E5631';
      var head = document.head;
      
      var links = [
        { rel: 'apple-touch-icon', sizes: '180x180', href: '/brands/' + brand + '/apple-touch-icon.png' },
        { rel: 'icon', type: 'image/png', sizes: '32x32', href: '/brands/' + brand + '/favicon-32x32.png' },
        { rel: 'icon', type: 'image/png', sizes: '16x16', href: '/brands/' + brand + '/favicon-16x16.png' },
        { rel: 'manifest', href: '/brands/' + brand + '/site.webmanifest' },
        { rel: 'mask-icon', href: '/brands/' + brand + '/safari-pinned-tab.svg', color: themeColor }
      ];
      
      links.forEach(function(attr) {
        var el = document.createElement('link');
        for (var k in attr) el.setAttribute(k, attr[k]);
        head.appendChild(el);
      });
      
      var metas = [
        { name: 'msapplication-TileColor', content: themeColor },
        { name: 'theme-color', content: themeColor }
      ];
      
      metas.forEach(function(attr) {
        var el = document.createElement('meta');
        for (var k in attr) el.setAttribute(k, attr[k]);
        head.appendChild(el);
      });
    })();
  </script>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
