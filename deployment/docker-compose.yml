version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: portal_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: portal_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portal_internal

  search:
    image: getmeili/meilisearch:v1.6
    container_name: portal_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - search_data:/meili_data
    networks:
      - portal_internal

  backend-init:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-imagick-exiftool-maria-pdo:8.5
    container_name: portal_backend_init
    depends_on:
      db:
        condition: service_started
    volumes:
      - /home/webadmin/websites/api-portal.reisinger.pictures:/var/www/html:Z
    environment: &backend_env
      - DB_HOST=db
      - DB_DATABASE=portal_db
      - DB_USERNAME=portal_user
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - APP_KEY=${APP_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REFRESH_TOKEN=${OAUTH_REFRESH_TOKEN}
      - MAKE_WEBHOOK_URL=${MAKE_WEBHOOK_URL}
      - MAKE_API_KEY=${MAKE_API_KEY}
      - MEILISEARCH_HOST=http://search:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - GALLERY_CLEANUP_GRACE_MONTHS=3
      # NEU: Expliziter Pfad für den FTP-Ordner im Container
      - FTP_STORAGE_PATH=/var/www/ftp
    command: >
      sh -c "
      echo 'Warte 15 Sekunden auf den MariaDB First-Boot...';
      sleep 15;
      php artisan optimize:clear;
      php artisan migrate --force;
      php artisan admin:update;
      echo 'Laravel Initialization complete.';
      "
    networks:
      - portal_internal

  backend:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-imagick-exiftool-maria-pdo:8.5
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      backend-init:
        condition: service_completed_successfully
      search:
        condition: service_started
    volumes:
      - /home/webadmin/websites/api-portal.reisinger.pictures:/var/www/html:Z
      - /home/webadmin/websites/photos:/var/www/photos:Z
      # NEU: Der FTP Ordner vom Host wird in den Container gemountet
      - /home/webadmin/websites/ftp:/var/www/ftp:Z
    environment: *backend_env
    command: >
      sh -c "
      if ! grep -q '/var/www/html/public' /etc/apache2/sites-available/000-default.conf; then
        sed -ri -e 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/*.conf;
        sed -ri -e 's!/var/www/!/var/www/html/public!g' /etc/apache2/apache2.conf /etc/apache2/conf-available/*.conf;
      fi;
      php artisan optimize:clear;
      apache2-foreground
      "
    networks:
      portal_internal:
      webnet:
        ipv4_address: 172.18.0.31

  frontend:
    image: nginx:alpine
    container_name: portal_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - /home/webadmin/websites/web-portal.reisinger.pictures/dist:/usr/share/nginx/html:ro
      - /home/webadmin/websites/web-portal.reisinger.pictures/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      portal_internal:
      webnet:
        ipv4_address: 172.18.0.30

networks:
  webnet:
    external: true
  portal_internal:

volumes:
  db_data:
  search_data: