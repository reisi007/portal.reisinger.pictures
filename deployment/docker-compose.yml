version: '3.8'

services:
  db:
    image: mariadb:11.4
    container_name: portal_db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: portal_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: "15s"
      timeout: 5s
      retries: 10
    networks:
      - portal_internal

  search:
    image: getmeili/meilisearch:v1.48.3
    container_name: portal_search
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - search_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: "15s"
      timeout: 5s
      retries: 5
    networks:
      - portal_internal

  composer_init:
    image: composer:latest
    container_name: portal_composer
    volumes:
      - /home/webadmin/websites/api-portal.reisinger.pictures:/app:Z
    command: install --ignore-platform-reqs --no-interaction --optimize-autoloader

  backend:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-exiftool-maria-pdo:8.5
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
      composer_init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    volumes:
      - /home/webadmin/websites/api-portal.reisinger.pictures:/var/www/html:Z
      - /home/webadmin/portal/images:/var/www/photos:Z
      - /home/webadmin/websites/ftp:/var/www/ftp:Z
    environment:
      - DB_HOST=db
      - DB_DATABASE=portal_db
      - DB_USERNAME=portal_user
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - APP_KEY=${APP_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_CHANNEL=stderr
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REFRESH_TOKEN=${OAUTH_REFRESH_TOKEN}
      - MAKE_WEBHOOK_URL=${MAKE_WEBHOOK_URL}
      - MAKE_API_KEY=${MAKE_API_KEY}
      - MEILISEARCH_HOST=http://search:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - GALLERY_CLEANUP_GRACE_MONTHS=3
      - AUTH_THROTTLE_LIMIT=10
      - DOWNLOAD_THROTTLE=120
      - ZIP_DOWNLOAD_THROTTLE=10
      - FTP_STORAGE_PATH=/var/www/ftp
      - STRIPE_KEY=${STRIPE_KEY}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PROXY_DELIVERY_HEADER=${PROXY_DELIVERY_HEADER}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck.php"]
      interval: "30s"
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
      
      if [ "$APP_ENV" = "production" ]; then
        if [ "$APP_KEY" = "base64:APP_KEY_REDACTED" ] || [ "$JWT_SECRET" = "JWT_SECRET_REDACTED" ]; then
          echo 'FATAL: Standard-Entwicklungsschluessel in Produktion erkannt. Start abgebrochen!';
          exit 1;
        fi;
      fi;
      
      if [ -z "$APP_KEY" ]; then php artisan key:generate --force; fi;
      if [ -z "$JWT_SECRET" ]; then php artisan jwt:secret --force; fi;
      
      if ! grep -q '/var/www/html/public' /etc/apache2/sites-available/000-default.conf; then
        sed -ri -e 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/*.conf;
        sed -ri -e 's!/var/www/!/var/www/html/public!g' /etc/apache2/apache2.conf /etc/apache2/conf-available/*.conf;
      fi;
      
      php artisan optimize:clear;
      php artisan migrate --force;
      php artisan scout:sync-index-settings;
      php artisan queue:restart;
      php artisan admin:update;
      
      echo 'Starte Hintergrund-Prozesse...';
      php artisan app:import-locations &
      php artisan queue:work --tries=3 &
      (while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done) &
      
      echo 'Starte Webserver...';
      apache2-foreground
      "
    networks:
      portal_internal:
      webnet:
        ipv4_address: 172.18.0.31

  frontend:
    image: nginx:alpine
    container_name: portal_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: "30s"
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    volumes:
      - /home/webadmin/websites/web-portal.reisinger.pictures/dist:/usr/share/nginx/html:ro
      - /home/webadmin/websites/web-portal.reisinger.pictures/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      portal_internal:
      webnet:
        ipv4_address: 172.18.0.30

networks:
  webnet:
    external: true
  portal_internal:

volumes:
  db_data:
  search_data: