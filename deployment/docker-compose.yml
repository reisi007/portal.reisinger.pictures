version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: portal_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: portal_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - webnet

  flyway:
    image: flyway/flyway:10-alpine
    container_name: portal_flyway
    depends_on:
      db:
        condition: service_started
    environment:
      FLYWAY_URL: jdbc:mariadb://db:3306/portal_db
      FLYWAY_USER: portal_user
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /home/webadmin/websites/portal.reisinger.pictures/flyway/migrations:/flyway/sql:Z
    command: -connectRetries=60 migrate
    networks:
      - webnet

  search:
    image: getmeili/meilisearch:v1.6
    container_name: portal_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - search_data:/meili_data
    networks:
      - webnet

  # Init-Container nutzt nun das Image mit MariaDB PDO Support
  backend-init:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-imagick-exiftool-maria-pdo:8.5
    container_name: portal_backend_init
    volumes:
      - /home/webadmin/websites/portal.reisinger.pictures/backend:/var/www/html:Z
    command: >
      sh -c "
      if [ ! -f .env ]; then cp .env.example .env; fi;
      if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force --no-interaction; fi;
      if grep -q '^JWT_SECRET=$' .env; then php artisan jwt:secret --force --no-interaction; fi;
      echo 'Laravel Initialization complete.';
      "
    networks:
      - webnet

  # Backend nutzt nun das Image mit MariaDB PDO Support
  backend:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-imagick-exiftool-maria-pdo:8.5
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
      backend-init:
        condition: service_completed_successfully
      search:
        condition: service_started
    volumes:
      - /home/webadmin/websites/portal.reisinger.pictures/backend:/var/www/html:Z
      - /home/webadmin/websites/photos:/var/www/photos:Z
    environment:
      - DB_HOST=db
      - DB_DATABASE=portal_db
      - DB_USERNAME=portal_user
      - DB_PASSWORD=${DB_PASSWORD}
      - MEILISEARCH_HOST=http://search:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - MAIL_MAILER=smtp
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Reisinger Portal}
      - GALLERY_CLEANUP_GRACE_MONTHS=${GALLERY_CLEANUP_GRACE_MONTHS:-3}
    networks:
      - webnet

  # NEU: Frontend Container
  frontend:
    image: nginx:alpine
    container_name: portal_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      # Mountet die lokal gebaute React-App (npm run build)
      - /home/webadmin/websites/portal.reisinger.pictures/frontend/dist:/usr/share/nginx/html:ro
      # Mountet die Nginx Konfiguration für SPA Routing
      - /home/webadmin/websites/portal.reisinger.pictures/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - webnet

networks:
  webnet:
    external: true

volumes:
  db_data:
  search_data:
