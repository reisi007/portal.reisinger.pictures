version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: portal_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: portal_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - portal_internal # <--- Abgeschottet

  search:
    image: getmeili/meilisearch:v1.6
    container_name: portal_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - search_data:/meili_data
    networks:
      - portal_internal # <--- Abgeschottet

  backend-init:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-imagick-exiftool-maria-pdo:8.5
    container_name: portal_backend_init
    depends_on:
      db:
        condition: service_started
    volumes:
      - /home/webadmin/websites/portal.reisinger.pictures/backend:/var/www/html:Z
    command: >
      sh -c "
      if [ ! -f .env ]; then cp .env.example .env; fi;
      if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force --no-interaction; fi;
      if grep -q '^JWT_SECRET=$' .env; then php artisan jwt:secret --force --no-interaction; fi;
      php artisan migrate --force;
      echo 'Laravel Initialization complete.';
      "
    networks:
      - portal_internal # <--- Muss nur intern mit der DB reden

  backend:
    image: ghcr.io/reisi007/php-apache-mod2rewrite-imagick-exiftool-maria-pdo:8.5
    container_name: portal_backend
    restart: unless-stopped
    depends_on:
      backend-init:
        condition: service_completed_successfully
      search:
        condition: service_started
    volumes:
      - /home/webadmin/websites/portal.reisinger.pictures/backend:/var/www/html:Z
      - /home/webadmin/websites/photos:/var/www/photos:Z
    environment:
      - DB_HOST=db
      - DB_DATABASE=portal_db
      - DB_USERNAME=portal_user
      - DB_PASSWORD=${DB_PASSWORD}
      - MEILISEARCH_HOST=http://search:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - MAIL_MAILER=smtp
      # ... restliche Variablen unverändert ...
      - GALLERY_CLEANUP_GRACE_MONTHS=${GALLERY_CLEANUP_GRACE_MONTHS:-3}
    networks:
      portal_internal: # Kommunikation mit DB/Search
      webnet:
        ipv4_address: 172.18.0.31 # <--- Feste IP fürs Web (falls NPM direkt ans Backend routet)

  frontend:
    image: nginx:alpine
    container_name: portal_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      - /home/webadmin/websites/portal.reisinger.pictures/frontend/dist:/usr/share/nginx/html:ro
      - /home/webadmin/websites/portal.reisinger.pictures/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      portal_internal: # Kommunikation mit Backend
      webnet:
        ipv4_address: 172.18.0.30 # <--- Feste IP fürs Web (Haupt-Einstiegspunkt für NPM)

networks:
  webnet:
    external: true
  portal_internal: # <--- Neues internes Netzwerk hinzugefügt

volumes:
  db_data:
  search_data: