services:
  search:
    image: getmeili/meilisearch:v1.48.3
    container_name: portal_search_test
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: test_meili_secret
    ports: ["7701:7700"]
    volumes: ["search_data_test:/meili_data"]

  mailpit:
    image: axllent/mailpit
    container_name: portal_mailpit_test
    restart: unless-stopped
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  search_data_test:
