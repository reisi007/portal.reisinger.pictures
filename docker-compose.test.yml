services:
  db:
    image: mariadb:11.4
    container_name: portal_db_test
    restart: unless-stopped
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: portal_test_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: admin
    volumes:
      - "db_data_test:/var/lib/mysql"
      - "./docker/test/init:/docker-entrypoint-initdb.d"

  search:
    image: getmeili/meilisearch:v1.48.3
    container_name: portal_search_test
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: test_meili_secret
    ports: ["7701:7700"]
    volumes: ["search_data_test:/meili_data"]

  mailpit:
    image: axllent/mailpit
    container_name: portal_mailpit_test
    restart: unless-stopped
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  db_data_test:
  search_data_test:
